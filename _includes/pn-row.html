{% if page.previous or page.next %}<nav class="pn-row {{ pn_class }}" aria-label="Other {{ pn_noun }}s">{% if page.previous %}<a class="pn-prev" href="{{ page.previous.url | relative_url }}{{ pn_anchor }}" title="{{ page.previous.title | escape }}"><span class="pn-arrow" aria-hidden="true">&larr;</span><span class="pn-text"><span class="pn-label">Previous {{ pn_noun }}</span><span class="pn-title">{{ page.previous.date | date: "%b %-d" }} &middot; {{ page.previous.title }}</span></span></a>{% else %}<span></span>{% endif %}{% if page.next %}<a class="pn-next" href="{{ page.next.url | relative_url }}{{ pn_anchor }}" title="{{ page.next.title | escape }}"><span class="pn-text"><span class="pn-label">Next {{ pn_noun }}</span><span class="pn-title">{{ page.next.date | date: "%b %-d" }} &middot; {{ page.next.title }}</span></span><span class="pn-arrow" aria-hidden="true">&rarr;</span></a>{% endif %}</nav>{% endif %}
