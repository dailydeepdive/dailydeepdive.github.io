title: "Daily Deep Dive (3D)"
short_title: 3D
tagline: How things work, one topic at a time.
description: >-
  A daily briefing: a fact-only recap of yesterday's markets and world news,
  then a deep dive into how something works and why it matters, with every
  claim sourced.
author: Josh
lang: en-US
timezone: America/New_York

# GitHub Pages address: https://dailydeepdive.github.io
# If you add a custom domain later, set url to it (baseurl stays "").
url: "https://dailydeepdive.github.io"
baseurl: ""

permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap


defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/
  - cloudflare/

poll_api: "https://dd-polls.jhughesenterprise.workers.dev"
